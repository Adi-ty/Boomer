disabled_rules:
  - trailing_comma
  - todo

# sorted_imports intentionally omitted: it conflicts with swiftformat's
# --importgrouping testable-bottom in test files.
opt_in_rules:
  - empty_count
  - first_where
  - redundant_nil_coalescing

type_name:
  excluded:
    - DS # design-token namespace, deliberately terse

excluded:
  - .build
  - DerivedData
  - Boomer.xcodeproj

line_length:
  warning: 140
  error: 200
  ignores_comments: true

identifier_name:
  min_length: 2
  excluded:
    - id
    - x
    - y
