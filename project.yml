name: Boomer

options:
  bundleIdPrefix: com.boomer
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: "" # set for notarized distribution
    CODE_SIGN_STYLE: Automatic

# Rive (animation runtime) is added in Phase 1, when real pet rendering lands.
# Until then the pet uses placeholder SF Symbol art so the project builds fully
# offline with no GitHub/SPM access. To add it back:
#   packages:
#     Rive:
#       url: https://github.com/rive-app/rive-ios
#       from: "6.0.0"
# and add the dependency to the Boomer target. Commit Package.resolved and build
# with -onlyUsePackageVersionsFromResolvedFile to avoid re-fetching/credential prompts.

targets:
  Boomer:
    type: application
    platform: macOS
    sources:
      - path: Sources/Boomer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boomer.Boomer
        PRODUCT_NAME: Boomer
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Boomer.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  BoomerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BoomerTests
    dependencies:
      - target: Boomer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boomer.BoomerTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Boomer:
    build:
      targets:
        Boomer: all
        BoomerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BoomerTests
    profile:
      config: Release
    archive:
      config: Release
