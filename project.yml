name: Boomer

options:
  bundleIdPrefix: com.boomer
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: "" # set for notarized distribution
    CODE_SIGN_STYLE: Automatic

packages:
  Rive:
    url: https://github.com/rive-app/rive-ios
    from: "6.0.0"

targets:
  Boomer:
    type: application
    platform: macOS
    sources:
      - path: Sources/Boomer
    dependencies:
      - package: Rive
        product: RiveRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boomer.Boomer
        PRODUCT_NAME: Boomer
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Boomer.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        DEAD_CODE_STRIPPING: YES
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  BoomerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BoomerTests
    dependencies:
      - target: Boomer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boomer.BoomerTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Boomer:
    build:
      targets:
        Boomer: all
        BoomerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BoomerTests
    profile:
      config: Release
    archive:
      config: Release
